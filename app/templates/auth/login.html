{% extends "base.html" %}
{% block title %}{{ t('sign_in_title') }} | {{ app_name }}{% endblock %}
{% block content %}
<section class="login-layout">
  <div class="login-intro">
    <h1>{{ t('sign_in_title') }}</h1>
  </div>
  <div class="login-card">
    {% if message %}<div class="alert alert-warning" role="alert">{{ message }}</div>{% endif %}
    <form method="post" action="/login" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-field"><label for="email">{{ t('email') }}</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254" placeholder="name@organization.ca"></div>
      <div class="form-field"><label for="password">{{ t('password') }}</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="button button-primary button-full" type="submit">{{ t('sign_in') }}</button>
    </form>
  </div>
</section>
{% endblock %}
