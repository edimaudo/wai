services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wai_intelligence
      POSTGRES_USER: wai_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wai_app -d wai_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wai_app:${POSTGRES_PASSWORD}@db:5432/wai_intelligence
      WAI_DATA_DIR: /app/data/source
      UPLOAD_DIR: /app/data/uploads
      SESSION_HTTPS_ONLY: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/source:/app/data/source:ro
      - wai_uploads:/app/data/uploads
    expose: ["8000"]
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [private]

volumes:
  postgres_data:
  wai_uploads:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
